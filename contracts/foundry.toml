[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

remappings = [
    "forge-std/=node_modules/forge-std/src/",
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
    "erc8183/=node_modules/erc-8183/base-contracts/",
]

# Deploy.s.sol reads its per-chain config and writes deployment records.
fs_permissions = [
    { access = "read", path = "scripts/config.json" },
    { access = "read-write", path = "deployments" },
]

# Chain keys match scripts/config.json, so `--rpc-url <key>` lines up with the
# `chainKey` argument Deploy.s.sol takes.
[rpc_endpoints]
local = "${RPC_LOCAL}"
arcTestnet = "${RPC_ARC_TESTNET}"